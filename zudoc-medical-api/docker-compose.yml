services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - node.name=snowstorm
      - cluster.name=snowstorm-cluster
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      elastic:
        aliases:
          - es
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - 127.0.0.1:9200:9200
    mem_reservation: 4g

  snowstorm:
    image: snomedinternational/snowstorm:latest
    container_name: snowstorm
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: java -Xms2g -Xmx4g --add-opens java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED -cp @/app/jib-classpath-file org.snomed.snowstorm.SnowstormApplication --elasticsearch.urls=http://es:9200
    networks:
      elastic:
        aliases:
          - snowstorm
    ports:
      - 8080:8080
    volumes:
      - ./import:/import

  browser:
    image: snomedinternational/snomedct-browser:latest
    container_name: browser
    depends_on:
      - snowstorm
    links:
      - snowstorm:snowstorm
    networks:
      - elastic
    environment:
      - API_HOST=http://snowstorm:8080/
    ports:
      - 80:80
    restart: always

  db:
    image: postgres:15-alpine
    container_name: zudoc-db
    restart: always
    environment:
      - POSTGRES_USER=zudoc
      - POSTGRES_PASSWORD=zudoc
      - POSTGRES_DB=zudoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zudoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.9.0
    container_name: zudoc-opensearch
    environment:
      - cluster.name=zudoc-cluster
      - node.name=zudoc-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9201:9200
      - 9601:9600
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - elastic

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.9.0
    container_name: zudoc-dashboards
    ports:
      - 5602:5601
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_PLUGIN=true
    depends_on:
      - opensearch

  search-api:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: zudoc-search-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://zudoc:zudoc@db:5432/zudoc?schema=public
      - OPENSEARCH_URL=http://opensearch:9200/drugs/_search
      - SNOWSTORM_URL=http://snowstorm:8080
      - PORT=3001
    ports:
      - 3001:3001
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - elastic
      - default

networks:
  elastic:

volumes:
  elastic:
  postgres_data:
  opensearch_data:
